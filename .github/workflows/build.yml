name: Build Crypto Yar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Fix private functions
      run: |
        sed -i 's/^    fun ema(/    private fun ema(/g' app/src/main/java/ir/cryptoyar/app/MainActivity.kt
        sed -i 's/^    fun rsi(/    private fun rsi(/g' app/src/main/java/ir/cryptoyar/app/MainActivity.kt
        sed -i 's/^    fun atr(/    private fun atr(/g' app/src/main/java/ir/cryptoyar/app/MainActivity.kt

    - name: Build APK
      run: |
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        gradle wrapper --gradle-version 8.7
        ./gradlew assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: cryptoyar-apk
        path: app/build/outputs/apk/debug/app-debug.apk
